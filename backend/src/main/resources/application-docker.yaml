spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/tasktracker
    username: postgres
    password: postgres
  data:
    redis:
      host: redis
      port: 6379
  cache:
    type: redis
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

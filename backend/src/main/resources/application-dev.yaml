spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tasktracker
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
